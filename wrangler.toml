name = "gdrive-mcp-server"
main = "dist/worker-server.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables
[vars]
MCP_LOG_LEVEL = "INFO"
GOOGLE_REDIRECT_URI = "https://gdrive-mcp-server.pgp-personal.workers.dev/callback"

# KV namespace for OAuth token storage
[[kv_namespaces]]
binding = "TOKEN_STORE"
id = "fc3e14101e9b46a08d7ae66850eae21f"

# KV namespace for caching (improves performance)
[[kv_namespaces]]
binding = "CACHE"
id = "db63916d248d4bb28141d3f2146f1541"